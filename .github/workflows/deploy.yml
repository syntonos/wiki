name: Deploy to GitHub Pages
on:
  push: { branches: [main, master] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Find the project folder (works even if it sits in a sub-folder)
        id: loc
        run: |
          pkg=$(find . -name package.json -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          echo "Using $pkg"
          echo "dir=$(dirname "$pkg")" >> "$GITHUB_OUTPUT"
      - name: Remove any committed node_modules / dist (a stale copy breaks the build)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: rm -rf node_modules dist
      - name: Install
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: "${{ steps.loc.outputs.dir }}/dist" }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
